<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galeri Portofolio</title>
  <style>
    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f4f4f5;
      margin: 0;
      padding: 40px 20px;
      color: #18181b;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
      font-weight: 700;
    }

    /* Container Tombol Filter */
    .filter-container {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 30px;
    }

    .filter-btn {
      background: #ffffff;
      border: 1px solid #e4e4e7;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 500;
    }

    .filter-btn:hover, .filter-btn.active {
      background: #18181b;
      color: #ffffff;
      border-color: #18181b;
    }

    .portfolio-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .card {
      background: #ffffff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
      transition: transform 0.2s ease;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .card:hover { transform: translateY(-4px); }

    .card-image-wrapper {
      width: 100%;
      aspect-ratio: 1 / 1;
      background-color: #18181b;
      position: relative;
      overflow: hidden;
    }

    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .card-content {
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex-grow: 1;
      background: #ffffff;
    }

    .card-publisher {
      font-size: 10px;
      color: #71717a;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
    }

    .card-title {
      margin: 0;
      font-size: 13px;
      line-height: 1.4;
      color: #27272a;
      font-weight: 500;
    }

    .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 4px;
    }

    .tag-badge {
      font-size: 9px;
      background: #f4f4f5;
      color: #71717a;
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
      font-weight: 600;
    }

    .loading { text-align: center; color: #71717a; }
  </style>
</head>
<body>

  <h1>Galeri Portofolio</h1>
  
  <div class="filter-container" id="filter-container"></div>
  <div id="status" class="loading">Memuat portofolio...</div>
  <div class="portfolio-grid" id="portfolio"></div>

  <script>
    const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQOs2FCesmwrvVJIUbpPJG8gwl3RqZovqA6nwKRyslPGTC84hTMZZgXYvO2uf_uGXtEb5tOiMt0wS5y/pub?gid=0&single=true&output=csv";

    const container = document.getElementById('portfolio');
    const filterContainer = document.getElementById('filter-container');
    const statusText = document.getElementById('status');
    let semuaKartu = [];

    // Fungsi membaca CSV
    function parseCSV(text) {
      const lines = text.split('\n');
      return lines.map(line => {
        const regex = /(?:,|\n|^)("(?:(?:"")*[^"]*)*"|[^",\n]*)/g;
        const matches = [];
        let match;
        while ((match = regex.exec(line)) !== null) {
          let val = match[1].replace(/^"|"$/g, '').trim();
          matches.push(val);
        }
        return matches;
      });
    }

    async function muatPortofolio() {
      try {
        const resSheet = await fetch(SHEET_CSV_URL);
        const csvText = await resSheet.text();
        const rows = parseCSV(csvText);

        // Mengambil data dan membuang baris pertama (Header: LINK, AKUN, CAPTION, TAG)
        const dataRows = rows.filter(row => row[0] && row[0].startsWith('http'));

        if (dataRows.length === 0) {
          statusText.innerText = "Belum ada data di Google Sheets.";
          return;
        }

        statusText.style.display = 'none';
        const setTag = new Set();

        for (let row of dataRows) {
          // SESUAI STRUKTUR SHEET KAMU:
          const url = row[0];             // Kolom A: LINK
          const customAkun = row[1];      // Kolom B: AKUN
          const customCaption = row[2];   // Kolom C: CAPTION
          const rawTags = row[3] || '';   // Kolom D: TAG

          const tagsArray = rawTags.split(',').map(t => t.trim()).filter(t => t !== '');
          tagsArray.forEach(t => setTag.add(t));

          try {
            let cleanUrl = url.split('?')[0];
            const response = await fetch(`https://api.microlink.io?url=${encodeURIComponent(cleanUrl)}`);
            const result = await response.json();
            
            if (result.status !== 'success') continue;
            
            const data = result.data || {};
            const gambar = data.image ? data.image.url : 'https://via.placeholder.com/400x400?text=No+Image';
            
            // Prioritaskan input dari Google Sheet kamu
            const akun = customAkun ? customAkun : (data.publisher || 'Instagram');
            const judul = customCaption ? customCaption : (data.title || 'Tanpa Judul');

            semuaKartu.push({
              url,
              gambar,
              akun,
              judul,
              tags: tagsArray
            });

          } catch (err) {
            console.error("Gagal memuat link:", url, err);
          }
        }

        buatTombolFilter(Array.from(setTag));
        tampilkanKartu(semuaKartu);

      } catch (error) {
        console.error("Gagal mengambil data:", error);
        statusText.innerText = "Gagal memuat data dari Google Sheets.";
      }
    }

    function buatTombolFilter(daftarTag) {
      let html = `<button class="filter-btn active" onclick="filterPortofolio('all', this)">Semua</button>`;
      daftarTag.forEach(tag => {
        html += `<button class="filter-btn" onclick="filterPortofolio('${tag}', this)">${tag}</button>`;
      });
      filterContainer.innerHTML = html;
    }

    function tampilkanKartu(itemArray) {
      container.innerHTML = '';
      itemArray.forEach(item => {
        const tagBadges = item.tags.map(t => `<span class="tag-badge">${t}</span>`).join('');
        
        const kartuHTML = `
          <a href="${item.url}" target="_blank" class="card">
            <div class="card-image-wrapper">
              <img src="${item.gambar}" alt="${item.judul}" loading="lazy">
            </div>
            <div class="card-content">
              <span class="card-publisher">${item.akun}</span>
              <h3 class="card-title">${item.judul}</h3>
              <div class="card-tags">${tagBadges}</div>
            </div>
          </a>
        `;
        container.innerHTML += kartuHTML;
      });
    }

    function filterPortofolio(tagPilihan, btnElement) {
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
      btnElement.classList.add('active');

      if (tagPilihan === 'all') {
        tampilkanKartu(semuaKartu);
      } else {
        const hasilFilter = semuaKartu.filter(item => item.tags.includes(tagPilihan));
        tampilkanKartu(hasilFilter);
      }
    }

    muatPortofolio();
  </script>
</body>
</html>
